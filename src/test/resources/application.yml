spring:
    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop
        database-platform: org.hibernate.dialect.H2Dialect
    jackson:
        property-naming-strategy: SNAKE_CASE

server:
    port: 0

camunda:
    client:
        enabled: false
